<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — ID Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">⚓ Sartagoda Port</a>
  <nav>
    <span class="nav-user">Admin</span>
  </nav>
</header>

<main>
  <section class="card" id="keyCard">
    <h2>Admin Sign-in</h2>
    <p class="verify-intro">Enter the admin key printed in the server console on startup (or your <code>ADMIN_KEY</code> environment variable).</p>
    <div class="form-row">
      <label for="adminKey">Admin Key</label>
      <div class="password-field">
        <input type="password" id="adminKey" placeholder="Paste admin key">
        <button type="button" class="toggle-password" data-target="adminKey" aria-label="Show admin key">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.7 20.7 0 0 1 5.06-6.06M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a20.7 20.7 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <button class="btn-primary" id="unlockBtn" type="button">Unlock</button>
  </section>

  <section class="card" id="reviewCard" style="display:none">
    <h2>Pending &amp; Reviewed ID Verifications</h2>
    <div id="adminList" class="admin-list"></div>
  </section>
</main>

<div id="toast" class="toast"></div>

<footer>
  <p>&copy; 2026 Sartagoda Port Booking System. All rights reserved.</p>
</footer>

<script src="password-toggle.js"></script>
<script src="admin.js"></script>
</body>
</html>
