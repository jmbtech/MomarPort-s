<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Sartagoda Port</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">⚓ Sartagoda Port</a>
  <nav>
    <a href="index.html#routes">Routes</a>
    <a href="booking.html">Book</a>
    <span id="navAccountSlot" class="nav-account"></span>
  </nav>
</header>

<main class="account-main">
  <section class="card account-card">
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">Log in</button>
      <button class="tab-btn" id="tabSignup" type="button">Sign up</button>
    </div>

    <form id="loginForm" class="account-form">
      <div class="form-row">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com">
      </div>
      <div class="form-row">
        <label for="loginPassword">Password</label>
        <div class="password-field">
          <input type="password" id="loginPassword" required placeholder="••••••••">
          <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.7 20.7 0 0 1 5.06-6.06M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a20.7 20.7 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary">Log in</button>
      <p class="form-note">No account yet? <a href="#" id="goSignup">Sign up</a></p>
    </form>

    <form id="signupForm" class="account-form" style="display:none">
      <div class="form-row">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" required placeholder="Juan Dela Cruz">
      </div>
      <div class="form-row">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" required placeholder="you@example.com">
      </div>
      <div class="form-row">
        <label for="signupPhone">Contact Number</label>
        <input type="tel" id="signupPhone" required placeholder="09xx-xxx-xxxx">
      </div>
      <div class="form-row">
        <label for="signupPassword">Password</label>
        <div class="password-field">
          <input type="password" id="signupPassword" required placeholder="At least 8 characters" minlength="8">
          <button type="button" class="toggle-password" data-target="signupPassword" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.7 20.7 0 0 1 5.06-6.06M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a20.7 20.7 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary">Create account</button>
      <p class="form-note">Already have an account? <a href="#" id="goLogin">Log in</a></p>
    </form>
  </section>
</main>

<div id="toast" class="toast"></div>

<footer>
  <p>&copy; 2026 Sartagoda Port Booking System. All rights reserved.</p>
</footer>

<script src="auth.js"></script>
<script src="password-toggle.js"></script>
<script src="account-page.js"></script>
</body>
</html>
